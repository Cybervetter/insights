name: Article index

# The README's article index is generated by scripts/build_index.py and
# committed by the author with the article (DEC-2049: CI no longer commits
# here - it used to push the index back under a person's name). This check
# flags a push whose README index is stale; run the script and commit.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  article-index:
    name: Article index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README index matches the articles
        run: |
          python3 scripts/build_index.py
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md article index is stale - run: python3 scripts/build_index.py, then commit README.md"
            git diff -- README.md | head -40
            exit 1
          fi
          echo "README index is current."
