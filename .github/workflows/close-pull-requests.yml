name: Close pull requests

# This organisation does not accept external contributions on public
# repositories, and internally we push directly to main (no PR workflow
# here either — see Cybervetter/CLAUDE.md). Any pull request that gets
# opened is closed and locked immediately, with a short explanation.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: "This repository does not accept external contributions — see `CONTRIBUTING.md`. Closing and locking this pull request.",
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number,
              state: "closed",
            });

            await github.rest.issues.lock({
              owner,
              repo,
              issue_number: pull_number,
              lock_reason: "resolved",
            });
